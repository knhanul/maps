# gildam-tiles: /srv/gildam-maps 정적 서빙 (Range·CORS). Caddy maps.nuni.co.kr → gildam-tiles:8080
server {
  listen 8080;
  server_tokens off;
  root /srv/gildam-maps;
  disable_symlinks off;
  add_header Access-Control-Allow-Origin "*" always;
  add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Range, If-Match, If-None-Match" always;
  add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag, Accept-Ranges" always;
  if ($request_method = OPTIONS) { return 204; }
  location = /healthz { access_log off; return 200 "ok\n"; }
  location ~ ^/tiles/current/([A-Za-z0-9._-]+\.pmtiles)$ {
    alias /srv/gildam-maps/current/$1;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag, Accept-Ranges" always;
    add_header Cache-Control "public, max-age=300" always;
  }
  location ~ "^/tiles/terrain/([A-Za-z0-9][A-Za-z0-9._-]{0,63})/([A-Za-z0-9._-]+\.pmtiles)$" {
    alias /srv/gildam-maps/terrain/$1/$2;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag, Accept-Ranges" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  # 버전별 경로라 바뀌지 않음 → 길게 캐시
  location ~ "^/tiles/([A-Za-z0-9][A-Za-z0-9._-]{0,63})/([A-Za-z0-9._-]+\.pmtiles)$" {
    alias /srv/gildam-maps/releases/$1/$2;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag, Accept-Ranges" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location /styles/  { add_header Access-Control-Allow-Origin "*" always; add_header Cache-Control "public, max-age=300" always; }
  location /fonts/   { add_header Access-Control-Allow-Origin "*" always; add_header Cache-Control "public, max-age=86400" always; }
  location /sprites/ { add_header Access-Control-Allow-Origin "*" always; add_header Cache-Control "public, max-age=86400" always; }
  location /tiles/ { return 404; }
  location = /routing/route {
    client_max_body_size 2k;
    proxy_pass http://gildam-routing-api:17778;
    proxy_set_header X-Real-IP $http_x_forwarded_for;
    proxy_set_header Origin $http_origin;
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    add_header Cache-Control "no-store" always;
  }
  location /v1/ { return 404; }
  # 공개 지도 웹 (정적 SPA, web/public → /srv/gildam-web)
  location = /index.html { root /srv/gildam-web; add_header Cache-Control "no-cache" always; add_header X-Frame-Options "SAMEORIGIN" always; }
  location / {
    root /srv/gildam-web;
    try_files $uri /index.html;
    add_header Cache-Control "public, max-age=3600" always;
  }
}
